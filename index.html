<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b3d2e">
<title>Chicago – kortspel online</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=18">
</head>
<body>
<header>
  <h1>Chicago</h1>
  <div id="givLabel"></div>
  <div class="hdrBtns"><button id="logBtn" class="chip" aria-label="Logg">Logg (<span id="logCount">0</span>)<span id="logDot" class="hidden"></span></button><button id="menuBtn" class="chip" aria-label="Meny">☰</button></div>
</header>
<section id="scorebar">
  <span id="talongInfo" class="chip subtle"></span>
</section>
<section id="table">
  <div id="phaseLabel"></div>
  <div id="botArea"></div>
  <div id="playerChips"></div>
  <div id="trickArea"></div>
  <div id="openCard"></div>
  <div id="tableMsg"></div>
</section>
<section id="playerArea">
  <div id="playerCards"></div>
  <div id="actions"></div>
</section>
<div id="overlay" class="hidden"><div id="overlayContent"></div></div>
<div id="logBackdrop" class="hidden"></div>
<aside id="logDrawer" class="hidden">
  <div id="logHead"><strong>Logg</strong><button id="logClose" class="chip" aria-label="Stäng loggen">✕</button></div>
  <div id="log"></div>
</aside>
<script type="module" src="js/app.js?v=18"></script>
</body>
</html>
